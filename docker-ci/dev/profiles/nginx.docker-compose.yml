version: '3.4'

services:
  nginx:
    # Tolerates startup-order races: nginx renders its proxy_pass targets at
    # startup and dies on a peer that has not joined the network yet (Podman
    # netavark only resolves joined containers, unlike Docker's embedded DNS).
    # Retrying until the peers are up heals the race without depends_on.
    restart: unless-stopped
    build:
      context: ../images_creation/nginx
      
    volumes:
      - ${OWGE_FRONTEND_ROOT}:/app
      - ${STATIC_IMAGES_DIR}:/var/owge_data/static
      - ${DYNAMIC_IMAGES_DIR}:/var/owge_data/dynamic
    environment: 
      - OWGE_BACKEND_SERVER
      - OWGE_WS_SERVER
      - OWGE_FRONTEND_SERVER
      - OWGE_ADMIN_FRONTEND_SERVER
      - OWGE_ACCOUNT_SERVER
      - OWGE_NGINX_PHPMYADMIN_SERVER
      - OWGE_REST_CONTEXT_PATH
      - OWGE_ADMIN_CONTEXT_PATH
    ports: 
      - "${OWGE_PORT}:80"